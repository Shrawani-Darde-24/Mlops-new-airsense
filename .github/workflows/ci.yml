name: AirSense AI CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # Job 1: Python syntax and fatal-error lint
  # Validates that every .py file compiles and has no undefined
  # names, syntax errors, or other fatal issues.
  # Does NOT run any script that needs dataset files.
  # -----------------------------------------------------------
  python-checks:
    name: Python Lint & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install linting tools
        run: pip install flake8

      - name: Compile-check all Python files
        run: |
          echo "=== Backend ==="
          python -m py_compile CP_new/backend/main.py

          echo "=== Data scripts ==="
          python -m py_compile CP_new/data/append_hourly_data.py
          python -m py_compile CP_new/data/generate_air_quality_data.py

          echo "All 3 Python files compiled successfully."

      - name: Flake8 fatal-error check
        run: |
          flake8 --select=E9,F63,F7,F82 --show-source --statistics \
            CP_new/backend/main.py \
            CP_new/data/append_hourly_data.py \
            CP_new/data/generate_air_quality_data.py

  # -----------------------------------------------------------
  # Job 2: Frontend dependency install and build
  # Ensures the React + Vite app installs cleanly and produces
  # a valid production build.
  # Note: This project has no lint script configured, so only
  # install and build are checked.
  # -----------------------------------------------------------
  frontend-checks:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CP_new/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  # -----------------------------------------------------------
  # Job 3: DVC configuration validation
  # Confirms DVC is installed and the project config is valid.
  # Does NOT run dvc pull (requires remote credentials).
  # dvc status is informational only (may report missing cache
  # in a clean checkout).
  # -----------------------------------------------------------
  dvc-check:
    name: DVC Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DVC
        run: |
          python -m pip install --upgrade pip
          pip install dvc

      - name: Verify DVC installation
        run: dvc version

      - name: DVC doctor
        run: dvc doctor

      - name: DVC status (informational)
        run: dvc status || echo "dvc status exited non-zero (expected in a clean checkout without cache)"